<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cab Booking</title>
    <link rel="stylesheet" href="cab.css">
</head>

<body>

    <div class="contact_background">

        <div class="contact_box">

            <a href="javascript:history.back()" class="close_button">&times;</a>

            <h1>BOOK YOUR CAB</h1>
            <p>Fill in your journey details to plan your ride.</p>

            <form id="cabForm" novalidate>

                <div class="cab_details">

                    <div>
                        <label for="fullname">Full Name</label>
                        <input type="text" id="fullname" placeholder="Enter your full name">
                    </div>

                    <div>
                        <label for="email">Email Address</label>
                        <input type="email" id="email" placeholder="Enter your email">
                    </div>

                    <div>
                        <label for="pickup">Pickup Location</label>
                        <input type="text" id="pickup" placeholder="Enter pickup location">
                    </div>

                    <div>
                        <label for="destination">Destination</label>
                        <input type="text" id="destination" placeholder="Enter destination">
                    </div>

                    <div>
                        <label for="date">Journey Date</label>
                        <input type="date" id="date">
                    </div>

                    <div>
                        <label for="time">Pickup Time</label>
                        <input type="time" id="time">
                    </div>

                    <div>
                        <label for="passengers">Number of Passengers</label>
                        <select id="passengers">
                            <option value="">Select Passengers</option>
                            <option value="1">1 Passenger</option>
                            <option value="2">2 Passengers</option>
                            <option value="3">3 Passengers</option>
                            <option value="4">4 Passengers</option>
                            <option value="5">5 Passengers</option>
                            <option value="6">6 Passengers</option>
                        </select>
                    </div>

                    <div>
                        <label for="cabtype">Select Cab Type</label>
                        <select id="cabtype">
                            <option value="">Select Cab</option>
                            <option value="Hatchback">Hatchback</option>
                            <option value="Sedan">Sedan</option>
                            <option value="SUV">SUV</option>
                            <option value="Innova">Innova</option>
                        </select>
                    </div>

                </div>

                <div class="confirmation">
                    <input type="radio" id="confirm" name="confirmation" value="yes">
                    <label for="confirm">I confirm that all the details provided above are correct.</label>
                </div>

                <button type="submit">CONFIRM CAB DETAILS</button>

            </form>

        </div>

    </div>

    <script>
        document.getElementById("cabForm").addEventListener("submit", function(event) {

            event.preventDefault();

            let fullname = document.getElementById("fullname").value.trim();
            let email = document.getElementById("email");
            let pickup = document.getElementById("pickup").value.trim();
            let destination = document.getElementById("destination").value.trim();
            let date = document.getElementById("date").value;
            let time = document.getElementById("time").value;
            let passengers = document.getElementById("passengers").value;
            let cabtype = document.getElementById("cabtype").value;
            let confirm = document.getElementById("confirm").checked;

            if (
                fullname === "" ||
                email.value.trim() === "" ||
                pickup === "" ||
                destination === "" ||
                date === "" ||
                time === "" ||
                passengers === "" ||
                cabtype === ""
            ) {
                alert("Please fill in all the details.");
                return;
            }

            if (!email.checkValidity()) {
                alert("Please enter a valid email address.");
                return;
            }

            if (pickup.toLowerCase() === destination.toLowerCase()) {
                alert("Pickup location and destination cannot be the same.");
                return;
            }

            if (date < new Date().toLocaleDateString("en-CA")) {
                alert("Please select a valid journey date.");
                return;
            }

            if (!confirm) {
                alert("Please confirm your journey details.");
                return;
            }

            alert("Your cab details have been submitted successfully!");

            document.getElementById("cabForm").reset();

        });
    </script>

</body>
</html>
